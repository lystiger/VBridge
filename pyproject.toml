[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vbridge"
version = "0.1.0"
description = "Local Vietnamese-English translation pipeline"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=43,<47",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
audio = [
  "av>=18,<19",
  "librosa>=0.11,<1",
  "pydub>=0.25,<1",
  "soundfile>=0.14,<1",
]
asr = ["faster-whisper>=1.1,<2"]
mt = ["sentencepiece>=0.2,<1", "torch>=2.5,<3", "transformers>=4.47,<5"]
vad = ["onnxruntime>=1.20,<2", "silero-vad>=6.2,<7"]
eval = ["sacrebleu>=2.5,<3"]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "services", "shared"]

[tool.pytest.ini_options]
addopts = "--cov=apps --cov=services --cov=shared --cov-report=term-missing --cov-fail-under=70"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
