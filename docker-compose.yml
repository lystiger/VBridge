services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      VBRIDGE_AUDIO_OUTPUT_DIR: /data/audio
      VBRIDGE_CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    volumes: ["audio-data:/data/audio"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports: ["5173:80"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  audio-data:
