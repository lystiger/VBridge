services:
  api:
    image: vbridge-api:relay
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      VBRIDGE_AUDIO_OUTPUT_DIR: /data/audio
      VBRIDGE_CORS_ORIGINS: http://localhost:5173
      VBRIDGE_DEPLOYMENT_ENVIRONMENT: ${VBRIDGE_DEPLOYMENT_ENVIRONMENT:-development}
      VBRIDGE_ROOM_TOKEN_SECRET: ${VBRIDGE_ROOM_TOKEN_SECRET:-vbridge-local-room-secret-change-me}
      VBRIDGE_INFERENCE_BACKEND: cpu
      VBRIDGE_ASR_MODE: mock
      VBRIDGE_MT_MODE: mock
      VBRIDGE_TTS_MODE: mock
      # Room state is process-local; this must remain one until shared storage is added.
      VBRIDGE_API_WORKERS: 1
      VBRIDGE_VAD_MODE: energy
      VBRIDGE_INFERENCE_MAX_CONCURRENCY: ${VBRIDGE_INFERENCE_MAX_CONCURRENCY:-1}
      VBRIDGE_INFERENCE_QUEUE_TIMEOUT_SECONDS: ${VBRIDGE_INFERENCE_QUEUE_TIMEOUT_SECONDS:-2}
      VBRIDGE_CONVERSATION_DATABASE_PATH: /data/db/vbridge.db
      VBRIDGE_CONVERSATION_ENCRYPTION_KEY: ${VBRIDGE_CONVERSATION_ENCRYPTION_KEY:-vbridge-local-conversation-key-change-me}
    ports: ["8000:8000"]
    volumes:
      - audio-data:/data/audio
      - conversation-data:/data/db
    healthcheck:
      # /health does not load models, so it passes quickly even for the real image.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        # Empty means same-origin: the web container proxies API and WebSocket traffic.
        VITE_API_URL: ${VITE_API_URL:-}
    ports: ["5173:80"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  audio-data:
  conversation-data:
  hf-cache:
